name: Build APK

# Se ejecuta automáticamente en cada cambio a main, y también se puede lanzar
# manualmente desde la pestaña "Actions" del repositorio (botón "Run workflow").
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Compilar APK de depuración (debug)
        run: gradle :appv2:assembleDebug --stacktrace

      - name: Publicar el APK como resultado descargable
        uses: actions/upload-artifact@v4
        with:
          name: checkin-bimodal-debug-apk
          path: appv2/build/outputs/apk/debug/*.apk
          if-no-files-found: error
